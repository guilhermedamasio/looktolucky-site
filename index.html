<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Look to Lucky</title>
  <meta name="description" content="Baixe o Look to Lucky para Windows." />

  <meta property="og:title" content="Look to Lucky" />
  <meta property="og:description" content="Baixe o Look to Lucky para Windows." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://looktolucky.com.br" />
  <meta name="theme-color" content="#0c0f14" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;700&display=swap"
    rel="stylesheet" />

  <style>
    :root {
      --bg-void: #0c0f14;
      --text-primary: #e7e9ed;
      --accent: #ff2be5;
      --accent-2: #9146ff;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--bg-void);
      background-image:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(255, 43, 229, 0.12), transparent),
        radial-gradient(ellipse 60% 50% at 100% 0%, rgba(145, 70, 255, 0.10), transparent);
      color: var(--text-primary);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 34px;
      padding: 40px 20px;
      text-align: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-weight: 700;
      font-size: clamp(1.2rem, 4.6vw, 1.7rem);
      letter-spacing: -0.02em;
    }

    .mark {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      background: var(--accent);
      box-shadow: 0 0 18px rgba(255, 43, 229, 0.65);
    }

    .download {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      max-width: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #12000f;
      font-weight: 700;
      font-size: clamp(1rem, 3.6vw, 1.1rem);
      text-decoration: none;
      padding: 16px 38px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(255, 43, 229, 0.3);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .download:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 38px rgba(255, 43, 229, 0.42);
    }
  </style>
</head>
<body>

  <span class="brand"><span class="mark" aria-hidden="true"></span> Look to Lucky</span>

  <a class="download" href="https://github.com/guilhermedamasio/LookToLucky-releases/releases/latest/download/LookToLucky.zip">
    ⭳ Baixar para Windows
  </a>

</body>
</html>
